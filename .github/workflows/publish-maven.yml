name: Publish Maven

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-snapshot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Require a snapshot version
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          version = ET.parse('pom.xml').findtext('{http://maven.apache.org/POM/4.0.0}version')
          if not version or not version.endswith('-SNAPSHOT'):
              raise SystemExit('main must contain a -SNAPSHOT version; releases use v* tags.')
          PY
      - name: Verify and publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp deploy

  publish-central:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: publish-central-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?)$ ]] || [[ "${RELEASE_TAG^^}" == *SNAPSHOT* ]]; then
            echo '::error::Use a release tag such as v0.1.0 or v0.2.0-rc.1.'
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Check Central publishing secrets
        shell: bash
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          for variable in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD MAVEN_GPG_PRIVATE_KEY; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing publishing secret: $variable"
              exit 1
            fi
          done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
      - name: Set release version in the runner checkout
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: mvn -B -ntp versions:set "-DnewVersion=$RELEASE_VERSION" -DgenerateBackupPoms=false
      - name: Verify, sign, and upload to Central Portal
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -ntp -Pcentral-release deploy
      - name: Save Central deployment bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-${{ steps.release.outputs.version || github.run_id }}
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: ignore
          retention-days: 7
      - name: Record publication status
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          printf 'Version `%s` was uploaded and validated. Finish publishing in [Central Portal](https://central.sonatype.com/publishing/deployments).\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
